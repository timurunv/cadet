[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadet"
version = "1.0.0"
description = "Causal hate speech detection"
requires-python = ">=3.12"
dependencies = [
    # Core ML/AI frameworks
    "torch==2.8.0",
    "transformers>=4.28.1",
    "datasets>=4.0.0",
    "scikit-learn>=1.7.0",
    "accelerate>=1.0.0",
    "parameterized>=0.9.0",

    # Data processing and analysis
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.1.0",
    "huggingface-hub>=0.35.0",

    # NLP preprocessing and evaluation
    "nltk>=3.8",
    "spacy>=3.4.0",
    "evaluate>=0.4.0",
    "sentencepiece>=0.1.91",

    # Configuration
    "pyyaml>=6.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",

    # Project utilities
    "pyprojroot>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["scripts"]

[dependency-groups]
dev = [
    "pip>=25.3",
    "pre-commit>=4.0",
    "ruff>=0.12",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.0",
    "nbstripout>=0.8.1",
    "notebook>=7.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
