exclude: uv.lock

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix, src, scripts]
      - id: ruff-format
        types_or: [python, pyi]
        args: [src, scripts]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^data/raw/
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
        types: [yaml]
      - id: check-toml
        types: [toml]
      - id: end-of-file-fixer
        types: [yaml, python, markdown, toml, text]
      - id: trailing-whitespace
        types: [yaml, python, markdown, toml, text]
      - id: debug-statements
        types: [python]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint-fix
        name: Markdown lint and fix
        description: Fixes the style of Markdown/Commonmark files
        entry: markdownlint --fix
        types: [markdown]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.0
    hooks:
      - id: nbstripout
        args: ['--drop-empty-cells', '--keep-output', '--extra-keys=metadata.celltoolbar cell.metadata.heading_collapsed metadata.kernelspec metadata.language_info.version']
